name: Build Orange Pi Zero 3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'config/**'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: zero3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      OPENWRT_COMMIT: 4da53efc2fe744601e6189492dbd06b8930d72b8
      WIFI_COMMIT: b4b1d4c4abc88d055ca99f51e11d9ebafccf4680
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget curl zstd
          df -h .
      - name: Fetch pinned sources
        run: |
          git init openwrt
          git -C openwrt remote add origin https://github.com/openwrt/openwrt.git
          git -C openwrt fetch --depth 1 origin "$OPENWRT_COMMIT"
          git -C openwrt checkout --detach FETCH_HEAD
          test "$(git -C openwrt rev-parse HEAD)" = "$OPENWRT_COMMIT"
          git init wifi-port
          git -C wifi-port remote add origin https://github.com/Anieake/openwrt-orangepi-zero2-zero3-wifi-modem.git
          git -C wifi-port fetch --depth 1 origin "$WIFI_COMMIT"
          git -C wifi-port checkout --detach FETCH_HEAD
          test "$(git -C wifi-port rev-parse HEAD)" = "$WIFI_COMMIT"
      - name: Integrate Wi-Fi and configure
        run: |
          python3 scripts/prepare.py openwrt wifi-port
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp ../config/zero3.config .config
          make defconfig
          for option in CONFIG_TARGET_sunxi_cortexa53_DEVICE_xunlong_orangepi-zero3 CONFIG_PACKAGE_kmod-uwe5622 CONFIG_PACKAGE_uwe5622-firmware CONFIG_PACKAGE_kmod-mt7921u CONFIG_PACKAGE_kmod-mt7921-firmware CONFIG_PACKAGE_wpad-mbedtls CONFIG_PACKAGE_luci; do
            grep -qx "$option=y" .config || { echo "Missing required option: $option"; exit 1; }
          done
          mkdir -p ../artifacts
          cp .config ../artifacts/build.config
          cp feeds.conf.default ../artifacts/feeds.conf.default
          printf 'OpenWrt: %s\nWi-Fi port: %s\nRepository: %s\n' "$OPENWRT_COMMIT" "$WIFI_COMMIT" "$GITHUB_SHA" > ../artifacts/sources.txt
      - name: Download sources
        working-directory: openwrt
        run: |
          set -o pipefail
          make download -j4 V=s 2>&1 | tee ../artifacts/download.log
      - name: Compile firmware
        working-directory: openwrt
        run: |
          set -o pipefail
          make -j2 V=s 2>&1 | tee ../artifacts/build.log
      - name: Collect images and manifests
        run: |
          test -n "$(find openwrt/bin/targets/sunxi/cortexa53 -maxdepth 1 -name '*orangepi-zero3*sdcard.img.gz' -print -quit)"
          cp -a openwrt/bin/targets/sunxi/cortexa53 artifacts/firmware
      - name: Upload firmware and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orangepi-zero3-openwrt-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
